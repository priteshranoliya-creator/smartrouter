[project]
name = "smartrouter"
version = "0.1.0"
description = "Local cache-aware model router for Claude Code"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx[http2]>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
    "sse-starlette>=2.1",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
laya = ["laya==0.4.11"]

[project.scripts]
router = "smartrouter.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartrouter"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["laya.*", "google.genai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not laya and not gemini and not scaledown'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "laya: needs the laya extra and model download (opt-in)",
    "gemini: calls the Gemini API, needs GEMINI_API_KEY (opt-in)",
    "scaledown: calls the ScaleDown API, needs SCALEDOWN_API_KEY (opt-in)",
]
